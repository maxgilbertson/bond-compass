name: Weekly briefing facts

# Early every Saturday: gather the week's numbers into data/briefings/facts/<date>.json and publish a
# factual draft. A scheduled Claude task then rewrites the draft in plain English (app/BRIEFING_PROMPT.md).
on:
  schedule:
    - cron: "45 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse slow-moving data (yield history, IMF, ratings, central-bank rates)
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: bondcache-${{ github.run_id }}
          restore-keys: bondcache-
      - run: python app/briefing.py
      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/briefings
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Weekly briefing facts $(date -u +%F)"
          git pull --rebase
          git push
      - name: Publish the site with the new draft
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}
