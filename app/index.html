<script>
"use strict";
/* ---------------------------------------------------------------- static knowledge */
const REGIONS = ["Americas","Europe","Asia-Pacific","Middle East & Africa"];
const BANK = {US:"Federal Reserve",XM:"European Central Bank",GB:"Bank of England",JP:"Bank of Japan",CA:"Bank of Canada",AU:"Reserve Bank of Australia",
  NZ:"Reserve Bank of New Zealand",CH:"Swiss National Bank",SE:"Riksbank (Sweden)",BR:"Central Bank of Brazil",MX:"Bank of Mexico",CL:"Central Bank of Chile",
  HU:"National Bank of Hungary",TR:"Central Bank of Turkey",CN:"People's Bank of China",IN:"Reserve Bank of India",ID:"Bank Indonesia",KR:"Bank of Korea",
  TH:"Bank of Thailand",HK:"Hong Kong Monetary Authority",ZA:"South African Reserve Bank"};
const BOND_NAME = {US:"Treasuries",GB:"gilts",DE:"Bunds",FR:"OATs",IT:"BTPs",ES:"Bonos",JP:"JGBs",CA:"Canadas",AU:"ACGBs",NZ:"NZGBs",CN:"CGBs",IN:"G-secs",
  BR:"NTN-Fs",MX:"Mbonos",ZA:"SAGBs",KR:"KTBs",CH:"Confederation bonds",SE:"government bonds",NL:"DSLs",BE:"OLOs",AT:"RAGBs",PT:"OTs",GR:"GGBs",IE:"Irish bonds",
  FI:"RFGBs",HU:"HGBs",TR:"Turkish bonds",ID:"INDOGBs",TH:"LBs",HK:"HKGBs",EG:"Egyptian bonds",NG:"FGN bonds",CL:"BTPs (Chile)"};
const CCY_NAME = {USD:"US dollar",CAD:"Canadian dollar",MXN:"Mexican peso",BRL:"Brazilian real",CLP:"Chilean peso",GBP:"pound",EUR:"euro",CHF:"Swiss franc",
  SEK:"Swedish krona",HUF:"Hungarian forint",TRY:"Turkish lira",JPY:"yen",CNY:"Chinese yuan",HKD:"Hong Kong dollar",INR:"Indian rupee",KRW:"Korean won",
  AUD:"Australian dollar",NZD:"New Zealand dollar",IDR:"Indonesian rupiah",THB:"Thai baht",ZAR:"South African rand",EGP:"Egyptian pound",NGN:"Nigerian naira"};
const TENORS = ["3M","6M","1Y","2Y","3Y","5Y","7Y","10Y","15Y","20Y","30Y"];

/* ---------------------------------------------------------------- state */
const store = makeStore("bc.");
const S = {data:null, region:store.get("region","all"), q:"", sort:store.get("sort",{k:"score",dir:-1}), cols:store.get("cols","key"),
  tenor:store.get("tenor","bench"), curveSel:store.get("curveSel",["US","GB","DE","JP"]), curveCmp:store.get("curveCmp",["m1","y1"]),
  heat:store.get("heat","level"), mapM:store.get("mapM","score"), sx:store.get("sx","safety"), sy:store.get("sy","value"), sgrp:store.get("sgrp","all"),
  credit:store.get("credit","BAMLH0A0HYM2"), infl:store.get("infl","DFII10"), banks:store.get("banks",["US","XM","GB","JP"]),
  slopeSort:{k:"s2s10",dir:1}, bankSort:{k:"d1y",dir:-1}, sel:null, dtab:"summary"};
const rows = () => S.data.rows;
const byCode = c => rows().find(r=>r.code===c);
const B = r => r.bonds.find(b=>b.tenor===r.bench);
const isIG = r => !!(r.rating&&r.rating.ig);
// the bond at a chosen maturity; if a market doesn't quote it, the nearest one within reason (marked approximate)
function bondAt(r,t){
  if(t==="bench") return B(r);
  const want=tenorYears(t), ok=r.bonds.filter(b=>!b.outlier);
  const ex=ok.find(b=>b.tenor===t); if(ex) return ex;
  const near=ok.map(b=>({b,d:Math.abs(Math.log(tenorYears(b.tenor)/want))})).sort((a,b)=>a.d-b.d)[0];
  return near&&near.d<Math.log(1.6)? {...near.b, approx:true} : null;
}
const bondName = r => BOND_NAME[r.code]||"government bonds";
const ratingTag = r => r.rating? `<span class="rt ${r.rating.ig?"ig":"hy"}" title="${esc(ratingTip(r))}">${esc(r.rating.label)}</span>` : `<span class="rt">NR</span>`;
function ratingTip(r){ const t=r.rating; if(!t) return "Not rated";
  return ["sp","moodys","fitch"].filter(k=>t[k]).map(k=>`${{sp:"S&P",moodys:"Moody's",fitch:"Fitch"}[k]} ${t[k].r} (${(t[k].o||"").toLowerCase()||"no outlook"})`).join(" · ")
    +` → average ${t.label}${t.ig?", investment grade":", below investment grade (high yield)"}`; }
const mktType = r => r.dm? "Developed" : "Emerging";
const regionOK = r => S.region==="all" || (S.region==="dm"?r.dm : S.region==="em"?!r.dm : S.region==="euro"?r.euro : S.region==="ig"?isIG(r) : r.region===S.region);
const tr1 = (r,k,w) => (r.tr&&r.tr[k]&&r.tr[k][w]!=null)? r.tr[k][w] : null;
const ccyName = c => CCY_NAME[c]||c;

/* ---------------------------------------------------------------- the score's ingredients, in words */
const PARTS = {
  realY:{name:"Real yield",group:"Value",val:r=>yld(B(r).realY),
    tip:"The benchmark yield minus the IMF's average inflation forecast over the bond's life (up to 5 years): roughly what you earn after inflation. Higher ranks higher."},
  carry:{name:"Cushion against rising yields",group:"Value",val:r=>B(r).breakeven==null?"–":`${Math.round(B(r).breakeven)}bp`,
    tip:"How far the yield could rise over the next 12 months before this bond does worse than cash at the central bank's rate. It counts the yield plus the 'roll-down' (the price gain as the bond ages along the curve), divided by its duration. Higher ranks higher."},
  cheap:{name:"Cheap compared with its own past",group:"Value",val:r=>B(r).pct3y==null?"–":`higher than ${B(r).pct3y}% of days`,
    tip:"Where today's yield sits within its own last 3 years. A yield near the top of its range means the bond is cheap by its own standards. Higher ranks higher."},
  rating:{name:"Credit rating",group:"Safety",val:r=>r.rating?r.rating.label:"–",
    tip:"The average of the S&P, Moody's and Fitch ratings, nudged by a third of a notch for a positive or negative outlook. Higher ranks higher."},
  debt:{name:"Government debt",group:"Safety",val:r=>r.fiscal.debt==null?"–":`${Math.round(r.fiscal.debt)}% of GDP`,
    tip:"Gross general-government debt as a share of the economy (IMF). Lower ranks higher."},
  gap:{name:"Budget vs what keeps debt steady",group:"Safety",val:r=>r.fiscal.gap==null?"–":r.fiscal.gap>0?`${r.fiscal.gap.toFixed(1)}% of GDP short`:`${Math.abs(r.fiscal.gap).toFixed(1)}% of GDP spare`,
    tip:"The budget surplus before interest that would hold debt steady as a share of GDP at today's 10-year borrowing cost and the IMF's growth forecast, minus the one the IMF expects. A positive gap means debt is on course to keep rising. Lower ranks higher."},
  intRev:{name:"Interest bill",group:"Safety",val:r=>r.fiscal.intRev==null?"–":`${Math.round(r.fiscal.intRev)}% of revenue`,
    tip:"Net interest paid as a share of all government revenue (IMF). The more of the tax take goes on interest, the less room the government has. Lower ranks higher."},
};

/* ---------------------------------------------------------------- table columns */
// k: sort key, l: label, s: small sub-label, g: value getter, f: cell HTML, t: header tooltip
const C = {
  score:{l:"Score",s:"0–100",g:r=>r.m.score,f:(v,r)=>`<div class="scorecell"><span class="bar"><i style="width:${v||0}%;background:${scoreColor(v)}"></i></span><b class="num">${v==null?"–":Math.round(v)}</b></div>`,t:"Bond Compass score: value (real yield, cushion, cheapness) 60%, safety (rating, debt, budget gap, interest bill) 40%. See the Guide."},
  signal:{l:"Signal",g:r=>r.m.score,f:(v,r)=>sigPill(r.m.signal),t:"What the score suggests, from Avoid to Strong overweight."},
  d1wS:{l:"Score 1w",g:r=>r.m.d1w,f:v=>`<span class="num ${cls(v)}">${isNum(v)?sgnN(v):"–"}</span>`,t:"Change in the score over the past week, from the daily record (blank until a week of records exists)."},
  value:{l:"Value",s:"0–100",g:r=>r.m.value,f:v=>`<span class="num" style="color:${scoreColor(v)}">${v==null?"–":Math.round(v)}</span>`,t:"The value half of the score: real yield, cushion against rising yields, cheapness vs its own past."},
  safety:{l:"Safety",s:"0–100",g:r=>r.m.safety,f:v=>`<span class="num" style="color:${scoreColor(v)}">${v==null?"–":Math.round(v)}</span>`,t:"The safety half: credit rating, debt, budget gap and interest bill."},
  y:{l:"Yield",s:"to maturity",g:(r,b)=>b&&b.y,f:(v,r,b)=>`<b class="num">${yld(v,2)}</b>${b&&b.approx?`<small class="muted" title="This market has no ${tenorWord(S.tenor)} bond; showing its ${tenorWord(b.tenor)}"> ${b.tenor}</small>`:""}`,t:"Yield to maturity: the yearly return if you buy today and hold to maturity, with coupons reinvested at the same rate."},
  chg:{l:"1d",s:"bp",g:(r,b)=>b&&b.chg,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Change in yield since the previous close, in basis points (0.01%). Red = yield up (price down)."},
  d1w:{l:"1w",s:"bp",g:(r,b)=>b&&b.d1w,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Yield change over a week (bp)."},
  d1m:{l:"1m",s:"bp",g:(r,b)=>b&&b.d1m,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Yield change over a month (bp)."},
  d3m:{l:"3m",s:"bp",g:(r,b)=>b&&b.d3m,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Yield change over 3 months (bp)."},
  ytd:{l:"YTD",s:"bp",g:(r,b)=>b&&b.ytd,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Yield change since 1 January (bp)."},
  d1y:{l:"1y",s:"bp",g:(r,b)=>b&&b.d1y,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Yield change over a year (bp)."},
  d3y:{l:"3y",s:"bp",g:(r,b)=>b&&b.d3y,f:v=>`<span class="num ${ycls(v)}">${bpf(v,true,false)}</span>`,t:"Yield change over 3 years (bp)."},
  range:{l:"1-year range",g:(r,b)=>b&&b.hi1y!=null?(b.y-b.lo1y)/((b.hi1y-b.lo1y)||1):null,f:(v,r,b)=>b&&b.hi1y!=null?`<div style="min-width:120px" title="Low ${yld(b.lo1y)} · average ${yld(b.avg1y)} · high ${yld(b.hi1y)}">${rangeBar(b.y,b.lo1y,b.hi1y,b.avg1y)}<small class="num muted">${yld(b.lo1y)} – ${yld(b.hi1y)}</small></div>`:"–",t:"Where today's yield sits between its 1-year low and high (the grey tick is the 1-year average)."},
  z1y:{l:"Z-score",s:"1 year",g:(r,b)=>b&&b.z1y,f:v=>`<span class="num">${isNum(v)?v.toFixed(1):"–"}</span>`,t:"How many standard deviations today's yield is above (+) or below (−) its 1-year average. Beyond ±2 is unusually stretched."},
  pct3y:{l:"3y pctile",g:(r,b)=>b&&b.pct3y,f:v=>`<span class="num">${isNum(v)?v+"%":"–"}</span>`,t:"Share of the last 3 years' daily yields that were below today's. 100% = highest yield (cheapest) in 3 years."},
  coupon:{l:"Coupon",g:(r,b)=>b&&b.coupon,f:v=>`<span class="num">${isNum(v)?v.toFixed(3).replace(/0+$/,"").replace(/\.$/,"")+"%":"–"}</span>`,t:"The bond's fixed yearly interest payment, as a % of face value."},
  mat:{l:"Maturity",g:(r,b)=>b&&b.mat,f:(v,r,b)=>`<span class="num">${b?isoDate(b.mat):"–"}${b&&b.approxMat?"*":""}</span>`,t:"When the bond repays its face value. * = estimated from the maturity bucket (no specific bond quoted)."},
  price:{l:"Price",s:"per 100",g:(r,b)=>b&&b.price,f:(v,r,b)=>`<span class="num" title="${b&&b.priceSrc==="quote"?"Quoted price":"Calculated from the yield"}">${num(v,2)}</span>`,t:"Clean price per 100 of face value (quoted where available, otherwise calculated from the yield)."},
  mod:{l:"Duration",s:"modified",g:(r,b)=>b&&b.mod,f:v=>`<span class="num">${num(v,2)}</span>`,t:"Modified duration: the % change in price for a 1 percentage-point change in yield. A duration of 8 means a 1% rise in yield cuts the price by about 8%."},
  conv:{l:"Convexity",g:(r,b)=>b&&b.conv,f:v=>`<span class="num">${num(v,1)}</span>`,t:"How duration itself changes as yields move. Higher convexity cushions losses when yields rise and adds to gains when they fall."},
  dv01:{l:"DV01",s:"per 1m",g:(r,b)=>b&&b.dv01,f:(v,r)=>`<span class="num">${isNum(v)?Math.round(v).toLocaleString():"–"}</span>`,t:"Money gained or lost on 1,000,000 of face value for a 1bp move in yield, in the bond's own currency."},
  rv:{l:"vs curve",s:"bp",g:(r,b)=>b&&b.rv,f:v=>`<span class="num ${isNum(v)&&Math.abs(v)>=8?(v>0?"pos":"neg"):""}">${bpf(v,true,false)}</span>`,t:"How far this bond's yield sits above (+, looks cheap) or below (−, looks dear) a smooth curve fitted through all of the country's maturities."},
  vol:{l:"Volatility",s:"bp a year",g:(r,b)=>b&&b.vol,f:v=>`<span class="num">${isNum(v)?v:"–"}</span>`,t:"How much the yield typically moves in a year (annualised standard deviation of daily changes over the last 3 months), in bp."},
  cash:{l:"Cash rate",g:r=>r.cash&&r.cash.rate,f:(v,r)=>`<span class="num" title="${r.cash&&r.cash.src==="bill"?`No policy-rate feed: shortest bill yield (${r.cash.tenor})`:"Central bank policy rate"}">${yld(v)}${r.cash&&r.cash.src==="bill"?"*":""}</span>`,t:"The central bank's policy rate: what cash earns. * = shortest bill yield where there's no policy-rate feed."},
  roll:{l:"Roll-down",s:"bp",g:(r,b)=>b&&b.roll,f:v=>`<span class="num">${bpf(v,true,false)}</span>`,t:"How much lower the yield would be a year from now if the curve stayed put, as the bond becomes a 1-year-shorter bond. Positive = a price gain from ageing."},
  ret12:{l:"12m return",s:"curve unchanged",g:(r,b)=>b&&b.ret12,f:v=>`<span class="num">${yld(v)}</span>`,t:"Expected return over 12 months in the bond's own currency if yields don't move: the yield plus the roll-down gain."},
  excess:{l:"Over cash",g:(r,b)=>b&&b.excess,f:v=>`<span class="num ${cls(v)}">${pp(v,2,true)}</span>`,t:"The 12-month return (curve unchanged) minus the cash rate: what you're paid for taking duration risk instead of sitting in cash."},
  breakeven:{l:"Cushion",s:"bp",g:(r,b)=>b&&b.breakeven,f:v=>`<span class="num ${cls(v)}">${bpf(v,false,false)}</span>`,t:"How far the yield could rise over 12 months before the bond does worse than cash. Bigger = more room for error."},
  hedgedGbp:{l:"Hedged £",g:(r,b)=>b&&b.hedgedGbp,f:v=>`<b class="num">${yld(v)}</b>`,t:"Yield for a pound-based investor who hedges the currency: the yield plus the UK cash rate minus this country's cash rate. Lets you compare bonds from different countries like for like."},
  hedgedUsd:{l:"Hedged $",g:(r,b)=>b&&b.hedgedUsd,f:v=>`<span class="num">${yld(v)}</span>`,t:"The same for a US-dollar investor: yield plus the US cash rate minus this country's cash rate."},
  realY:{l:"Real yield",g:(r,b)=>b&&b.realY,f:v=>`<b class="num ${cls(v)}">${yld(v)}</b>`,t:"Yield minus the IMF's average inflation forecast over the bond's life (up to 5 years): roughly the return after inflation."},
  infl:{l:"Inflation",s:"IMF, 5y avg",g:r=>r.fiscal.inflFwd,f:v=>`<span class="num">${yld(v,1)}</span>`,t:"The IMF's average consumer-price inflation forecast for the next 5 years."},
  vsUS:{l:"vs US",s:"bp",g:(r,b)=>b&&b.vsUS,f:v=>`<span class="num">${bpf(v,true,false)}</span>`,t:"Spread over US Treasuries of the same maturity, in bp."},
  vsDE:{l:"vs Bunds",s:"bp",g:(r,b)=>b&&b.vsDE,f:v=>`<span class="num">${bpf(v,true,false)}</span>`,t:"Spread over German Bunds of the same maturity (the euro area's benchmark), in bp."},
  vsGB:{l:"vs gilts",s:"bp",g:(r,b)=>b&&b.vsGB,f:v=>`<span class="num">${bpf(v,true,false)}</span>`,t:"Spread over UK gilts of the same maturity, in bp."},
  s2s10:{l:"2s10s",s:"bp",g:r=>r.slopes.s2s10,f:v=>`<span class="num ${isNum(v)&&v<0?"neg":""}">${bpf(v,true,false)}</span>`,t:"10-year yield minus 2-year yield. Negative = an inverted curve, which has often come before recessions."},
  s5s30:{l:"5s30s",s:"bp",g:r=>r.slopes.s5s30,f:v=>`<span class="num">${bpf(v,true,false)}</span>`,t:"30-year minus 5-year yield."},
  expects:{l:"Market expects",g:r=>r.expects,f:v=>expectsText(v,true),t:"2-year yield minus today's cash rate. Well above zero = markets expect rate rises; well below = cuts."},
  rating:{l:"Rating",g:r=>r.rating?r.rating.score:null,f:(v,r)=>ratingTag(r),t:"Average of S&P, Moody's and Fitch. BBB− or better is investment grade."},
  debt:{l:"Debt",s:"% GDP",g:r=>r.fiscal.debt,f:v=>`<span class="num">${isNum(v)?Math.round(v):"–"}</span>`,t:"Gross government debt, % of GDP, this year (IMF)."},
  debt5:{l:"Debt in 5y",s:"% GDP",g:r=>r.fiscal.debtIn5y,f:(v,r)=>`<span class="num">${isNum(v)?Math.round(v):"–"}</span> <small class="num ${isNum(v)&&isNum(r.fiscal.debt)?(v>r.fiscal.debt?"neg":"pos"):""}">${isNum(v)&&isNum(r.fiscal.debt)?sgnN(v-r.fiscal.debt):""}</small>`,t:"Where the IMF expects debt to be in 5 years (and the change from today)."},
  balance:{l:"Budget",s:"% GDP",g:r=>r.fiscal.balance,f:v=>`<span class="num ${cls(v)}">${pp(v,1,true)}</span>`,t:"Overall budget balance this year, % of GDP (negative = deficit)."},
  primary:{l:"Primary",s:"% GDP",g:r=>r.fiscal.primary,f:v=>`<span class="num ${cls(v)}">${pp(v,1,true)}</span>`,t:"Budget balance before interest payments, % of GDP."},
  interest:{l:"Interest",s:"% GDP",g:r=>r.fiscal.interest,f:v=>`<span class="num">${pp(v,1)}</span>`,t:"Net interest paid, % of GDP (primary balance minus overall balance)."},
  intRev:{l:"Interest",s:"% revenue",g:r=>r.fiscal.intRev,f:v=>`<span class="num ${isNum(v)&&v>=15?"neg":""}">${isNum(v)?Math.round(v)+"%":"–"}</span>`,t:"Net interest as a share of government revenue."},
  effRate:{l:"Avg cost",s:"of debt",g:r=>r.fiscal.effRate,f:v=>`<span class="num">${yld(v,1)}</span>`,t:"Net interest divided by debt: the average rate the government pays on what it already owes."},
  refi:{l:"Refi gap",s:"10Y − avg",g:r=>r.fiscal.refi,f:v=>`<span class="num ${isNum(v)&&v>1?"neg":""}">${pp(v,1,true)}</span>`,t:"Today's 10-year yield minus the average cost of existing debt. Positive = the interest bill will keep climbing as old debt is refinanced."},
  rg:{l:"r − g",g:r=>r.fiscal.rMinusG,f:v=>`<span class="num ${isNum(v)&&v>0?"neg":"pos"}">${pp(v,1,true)}</span>`,t:"10-year yield minus expected nominal GDP growth (IMF, next 5 years). Positive = debt grows faster than the economy unless the government runs a surplus before interest."},
  gap:{l:"Budget gap",s:"% GDP",g:r=>r.fiscal.gap,f:v=>`<span class="num ${isNum(v)&&v>0.5?"neg":isNum(v)&&v<-0.5?"pos":""}">${pp(v,1,true)}</span>`,t:"Primary surplus needed to hold debt/GDP steady at today's yields, minus the one expected. Positive = debt on course to rise."},
  growth:{l:"Growth",s:"real, 5y",g:r=>r.fiscal.growthFwd,f:v=>`<span class="num">${yld(v,1)}</span>`,t:"IMF average real GDP growth forecast, next 5 years."},
  r3m:{l:"3m",s:"local",g:r=>tr1(r,"m3","local"),f:v=>`<span class="num ${cls(v)}">${pct(v,1)}</span>`,t:"Approximate total return of the benchmark bond over 3 months, in its own currency."},
  rytd:{l:"YTD",s:"local",g:r=>tr1(r,"ytd","local"),f:v=>`<span class="num ${cls(v)}">${pct(v,1)}</span>`,t:"Approximate total return since 1 January, own currency."},
  r1y:{l:"1y",s:"local",g:r=>tr1(r,"y1","local"),f:v=>`<span class="num ${cls(v)}">${pct(v,1)}</span>`,t:"Approximate total return over a year, own currency (coupon income plus price change)."},
  fx1y:{l:"Currency",s:"vs £, 1y",g:r=>tr1(r,"y1","fx"),f:v=>`<span class="num ${cls(v)}">${pct(v,1)}</span>`,t:"How much the currency gained (+) or lost (−) against the pound over a year."},
  r1yGbp:{l:"1y in £",s:"unhedged",g:r=>tr1(r,"y1","gbp"),f:v=>`<b class="num ${cls(v)}">${pct(v,1)}</b>`,t:"Return over a year for a UK investor who didn't hedge the currency."},
  r1yHdg:{l:"1y in £",s:"hedged",g:r=>tr1(r,"y1","hedged"),f:v=>`<span class="num ${cls(v)}">${pct(v,1)}</span>`,t:"Return over a year for a UK investor who hedged the currency back to pounds (approximate)."},
  spark:{l:"Past year",g:r=>null,f:(v,r)=>sparkSVG(r.spark),t:"The benchmark yield over the past year. Green = yields fell (prices rose); red = yields rose."},

function expectsText(v,short=false){ if(!isNum(v)) return "–";
  const w = v>=40? "rate rises" : v>=15? "a small rise" : v<=-40? "rate cuts" : v<=-15? "a small cut" : "little change";
  const tone = v>=15? "neg" : v<=-15? "pos" : "muted";
  return short? `<span class="num ${tone}" title="2-year yield is ${bpf(v,true)} vs cash">${esc(w)} <small>(${bpf(v,true,false)})</small></span>` : w; }

/* ---------- overview */
function tile({label,code,val,unit="%",chg,chg2,lab2="1m",spark,hint,open,dp=2,inv=true}){
  return `<div class="tile${open?" click":""}" ${open?`data-open="${open}" role="button" tabindex="0"`:""}>
    <div class="lab"><span>${esc(label)}</span>${code?`<small class="num">${esc(code)}</small>`:""}</div>
    <div class="val">${isNum(val)?val.toFixed(dp):"–"}<small>${unit}</small></div>
    <div class="chg"><span class="${inv?ycls(chg):cls(chg)}" title="Since the previous close">${bpf(chg)} today</span>${isNum(chg2)?`<span class="${inv?ycls(chg2):cls(chg2)}">${bpf(chg2)} ${lab2}</span>`:""}</div>
    ${spark?sparkSVG(spark,{w:160,h:30,invert:inv}):""}${hint?`<div class="hint">${hint}</div>`:""}</div>`;
}
function spreadSpark(a,b){ if(!a||!b) return null; const n=Math.min(a.length,b.length); return a.slice(-n).map((v,i)=>(v-b.slice(-n)[i])*100); }
function overviewHTML(d){
  const g=c=>byCode(c), b=c=>g(c)&&B(g(c));
  const us=g("US"), de=g("DE"), fr=g("FR"), it=g("IT"), gb=g("GB"), jp=g("JP");
  const hy=d.credit.find(c=>c.id==="BAMLH0A0HYM2"), ig=d.credit.find(c=>c.id==="BAMLC0A0CM");
  const sprd=(x,y)=>x&&y? {val:(B(x).y-B(y).y)*100, chg:isNum(B(x).chg)&&isNum(B(y).chg)?B(x).chg-B(y).chg:null, m1:isNum(B(x).d1m)&&isNum(B(y).d1m)?B(x).d1m-B(y).d1m:null, spark:spreadSpark(x.spark,y.spark)} : null;
  const fd=sprd(fr,de), id=sprd(it,de), u2=us&&us.bonds.find(x=>x.tenor==="2Y");
  const tiles=[
    us&&tile({label:"US 10-year Treasury",code:"UST",val:b("US").y,chg:b("US").chg,chg2:b("US").d1m,spark:us.spark,open:"US"}),
    u2&&tile({label:"US 2-year Treasury",code:"UST",val:u2.y,chg:u2.chg,chg2:u2.d1m,open:"US",hint:"Most sensitive to the Fed's next moves"}),
    gb&&tile({label:"UK 10-year gilt",code:"UKT",val:b("GB").y,chg:b("GB").chg,chg2:b("GB").d1m,spark:gb.spark,open:"GB"}),
    de&&tile({label:"German 10-year Bund",code:"DBR",val:b("DE").y,chg:b("DE").chg,chg2:b("DE").d1m,spark:de.spark,open:"DE"}),
    jp&&tile({label:"Japan 10-year JGB",code:"JGB",val:b("JP").y,chg:b("JP").chg,chg2:b("JP").d1m,spark:jp.spark,open:"JP"}),
    us&&tile({label:"US curve, 10y minus 2y",code:"2s10s",val:us.slopes.s2s10,unit:"bp",dp:0,chg:isNum(b("US").chg)&&u2&&isNum(u2.chg)?b("US").chg-u2.chg:null,chg2:isNum(us.slopes.s2s10_1m)?us.slopes.s2s10-us.slopes.s2s10_1m:null,inv:false,open:"US",hint:"Below zero = inverted"}),
    fd&&tile({label:"France minus Germany, 10y",code:"OAT–Bund",val:fd.val,unit:"bp",dp:0,chg:fd.chg,chg2:fd.m1,spark:fd.spark,open:"FR",hint:"Extra yield for French risk"}),
    id&&tile({label:"Italy minus Germany, 10y",code:"BTP–Bund",val:id.val,unit:"bp",dp:0,chg:id.chg,chg2:id.m1,spark:id.spark,open:"IT",hint:"The euro area's stress gauge"}),
    d.move&&`<div class="tile click" data-gox="credit" role="button" tabindex="0" onclick="Views.go('credit',true)"><div class="lab"><span>Bond volatility (MOVE)</span><small class="num">ICE BofA</small></div><div class="val">${d.move.last.toFixed(0)}</div>
      <div class="chg"><span class="${ycls(d.move.d1m)}">${sgnN(d.move.d1m)} 1m</span><span class="muted">1y ${d.move.lo1y.toFixed(0)}–${d.move.hi1y.toFixed(0)}</span></div>${sparkSVG(d.move.series.slice(-53).map(p=>p[1]),{w:160,h:30})}<div class="hint">Calm ≤ 80 · stressed ≥ 120</div></div>`,
    hy&&`<div class="tile click" role="button" tabindex="0" onclick="Views.go('credit',true)"><div class="lab"><span>US high-yield spread</span><small class="num">OAS</small></div><div class="val">${hy.last.toFixed(0)}<small>bp</small></div>
      <div class="chg"><span class="${ycls(hy.d1m)}">${bpf(hy.d1m)} 1m</span><span class="muted">IG ${ig?ig.last.toFixed(0):"–"}bp</span></div>${sparkSVG(hy.series.slice(-53).map(p=>p[1]),{w:160,h:30})}<div class="hint">${hy.pct>=50?`Wider than ${hy.pct}%`:`Tighter than ${100-hy.pct}%`} of days in the last ${Math.round((Date.now()/1000-hy.since)/31557600)} years</div></div>`,
  ].filter(Boolean);
  const rs=rows();
  const top=rs.filter(r=>r.m.score!=null).sort((a,b)=>b.m.score-a.m.score).slice(0,5);
  const real=rs.filter(r=>isIG(r)&&isNum(B(r).realY)).sort((a,b)=>B(b).realY-B(a).realY).slice(0,5);
  const cush=rs.filter(r=>isIG(r)&&isNum(B(r).breakeven)).sort((a,b)=>B(b).breakeven-B(a).breakeven).slice(0,5);
  const strain=rs.filter(r=>isNum(r.fiscal.gap)&&r.fiscal.debt>=40).sort((a,b)=>b.fiscal.gap-a.fiscal.gap).slice(0,5);
  const pick=(r,big,small,sub)=>`<div class="pick" data-open="${r.code}" role="button" tabindex="0">${ring(r.m.score,{size:40,stroke:4})}
    <div class="pick-main"><div class="pick-name">${esc(r.name)}</div><div class="pick-sub">${esc(sub)}</div></div><div class="pick-big">${big}<small>${small}</small></div></div>`;
  const sub=r=>`${B(r).tenor} ${yld(B(r).y)} · ${r.rating?r.rating.label:"NR"}`;
  const moved=rs.filter(r=>isNum(B(r).chg)&&!B(r).stale).sort((a,b)=>B(b).chg-B(a).chg);
  const movers=moved.length>16? [...moved.slice(0,8),...moved.slice(-8)] : moved;
  const sigs=rs.map(r=>r.m.signal).filter(Boolean);
  return `
  <div class="intro">${icon("info",18)}<div>Live yields, curves and risk numbers for the benchmark government bonds of <b>${rs.length} countries</b>, alongside the public finances behind them.
    Click any country for its full detail; the <a href="#monitor">Monitor</a> has every number in one sortable table, and the <a href="#guide">Guide</a> explains each term.
    Yield changes are in basis points (bp, 0.01%); <span class="neg">red</span> means yields rose, which means prices fell.</div></div>
  <section>${secHead({eyebrow:"Markets now",title:"The bond market at a glance",lead:"The yields most of the world prices from, the spreads that signal stress, and how jumpy the market is. Sparklines show the past year."})}
    <div class="macro">${tiles.join("")}</div></section>
  <section>${secHead({eyebrow:"Backdrop",title:"What's driving bonds",lead:"Fixed rules applied to today's numbers. Coloured rules are active now; grey ones are within normal ranges."})}
    <div class="rulegrid">${d.rules.map(x=>`<div class="card rule ${x.active?x.tone:"off"}"><div class="rule-head"><b>${esc(x.name)}</b>${x.active?tag(x.tone==="pos"?"Supportive":x.tone==="neg"?"Headwind":x.tone==="warn"?"Caution":"Notable",x.tone):tag("Normal")}</div><p>${esc(x.note)}</p></div>`).join("")}</div></section>
  ${d.calendar&&d.calendar.length?`<section>${secHead({eyebrow:"Calendar",title:"Coming up",lead:"Central-bank decisions and the data releases that move bond yields most, over the next few weeks."})}${calendarHTML(d.calendar,{limit:10,title:"Next events"})}</section>`:""}
  <section>${secHead({eyebrow:"Shortlists",title:"Where the numbers point",lead:"Four ways to cut the list. Investment grade = rated BBB− or better on average. Click any market for the reasons behind it."})}
    <div class="picks">
      <div class="card pickcol"><h3><span class="pc-ico accent">${icon("award",16)}</span>Highest scores</h3><p>Best mix of value and safety.</p>${top.map(r=>pick(r,Math.round(r.m.score),"score",sub(r))).join("")}</div>
      <div class="card pickcol"><h3><span class="pc-ico pos">${icon("coin",16)}</span>Best real yields</h3><p>Investment grade, after expected inflation.</p>${real.map(r=>pick(r,yld(B(r).realY),"real",sub(r))).join("")}</div>
      <div class="card pickcol"><h3><span class="pc-ico info">${icon("shield",16)}</span>Most cushion</h3><p>Investment grade: how far yields could rise in a year before cash wins.</p>${cush.map(r=>pick(r,Math.round(B(r).breakeven)+"bp","cushion",sub(r))).join("")}</div>
      <div class="card pickcol"><h3><span class="pc-ico neg">${icon("alert",16)}</span>Fiscal strain</h3><p>Debt over 40% of GDP and furthest from holding it steady at today's yields.</p>${strain.map(r=>pick(r,pp(r.fiscal.gap,1,true),"of GDP short",`debt ${Math.round(r.fiscal.debt)}% · interest ${isNum(r.fiscal.intRev)?Math.round(r.fiscal.intRev)+"% of revenue":"–"}`)).join("")}</div>
    </div></section>
  <section class="two">
    <div class="card panel">${secHead({eyebrow:"Today",title:"Biggest benchmark yield moves",h:"h3",lead:`The ${movers.length<moved.length?"8 biggest rises and 8 biggest falls":"moves"} in each market's benchmark (mostly 10-year) yield since the previous close. All ${moved.length} are in the <a href="#monitor">Monitor</a>.`})}
      <div class="bars">${barsSVG(movers.map(r=>({label:r.name,sub:B(r).tenor,v:B(r).chg,key:r.code,color:B(r).chg>=0?"var(--dneg)":"var(--dpos)"})),{fmt:v=>bpf(v),labelW:150,rowH:24})}</div>
      <p class="note">Blue = yield fell (price rose); red = yield rose (price fell). Some markets quote less often, so their change may be from an earlier session.</p></div>
    <div class="card panel">${secHead({eyebrow:"Signals",title:`How the ${sigs.length} markets score`,h:"h3",lead:"The score blends value (60%) and safety (40%). See the Guide for the recipe."})}
      ${sigDist(sigs)}
      <div style="margin-top:14px" class="scatter" id="ovScatter"></div>
      <p class="note">Each dot is a market: further right = safer government finances and rating; higher = better value (real yield, cushion, cheapness). Top right is the sweet spot.</p></div>
  </section>`;
}
function vsQuad(X,Y,{L,R,T,B,W,H}){ const cx=X(50), cy=Y(50);

    <line x1="${L}" x2="${W-R}" y1="${cy}" y2="${cy}" stroke="var(--line)"/><line x1="${cx}" x2="${cx}" y1="${T}" y2="${H-B}" stroke="var(--line)"/>
    <text x="${W-R-6}" y="${T+14}" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--pos)">GOOD VALUE, SAFER</text>
    <text x="${L+6}" y="${T+14}" font-size="11.5" font-weight="600" fill="var(--warn)">GOOD VALUE, RISKIER</text>
    <text x="${W-R-6}" y="${H-B-8}" text-anchor="end" font-size="11.5" font-weight="600" fill="var(--info)">SAFER, POOR VALUE</text>
    <text x="${L+6}" y="${H-B-8}" font-size="11.5" font-weight="600" fill="var(--neg)">POOR VALUE, RISKIER</text>`; }

function monitorTable(){
  const cols=COLSETS[S.cols].cols, q=S.q.trim().toLowerCase();
  const list=rows().filter(regionOK).filter(r=>!q||r.name.toLowerCase().includes(q)||r.code.toLowerCase()===q);
  const bOf=r=>bondAt(r,S.tenor);
  const sk=S.sort.k, getter=sk==="name"?(r=>r.name):(C[sk]?(r=>C[sk].g(r,bOf(r))):(r=>r.m.score));
  list.sort((a,b)=>{ const x=getter(a), y=getter(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return (typeof x==="string"? x.localeCompare(y) : x-y)*S.sort.dir; });
  const th=k=>{ const c=C[k]; return `<th data-sort="${k}" title="${esc(c.t||"")}" ${S.sort.k===k?`data-dir="${S.sort.dir>0?"▲":"▼"}"`:""}>${esc(c.l)}${c.s?`<small>${esc(c.s)}</small>`:""}</th>`; };
  return `<table><thead><tr><th class="rank l">#</th><th class="l sticky" data-sort="name" ${S.sort.k==="name"?`data-dir="${S.sort.dir>0?"▲":"▼"}"`:""}>Country<small>${S.tenor==="bench"?"benchmark bond":tenorWord(S.tenor)+" bond"}</small></th>${cols.map(th).join("")}</tr></thead>
    <tbody>${list.map((r,i)=>{ const b=bOf(r); return `<tr data-open="${r.code}"><td class="rank l">${i+1}</td>
      <td class="l sticky"><div class="nmcell"><div><b>${esc(r.name)}</b><small>${esc(r.code)} · ${esc(r.ccy)} · ${b?b.tenor:"–"}${b&&b.stale?" · stale":""}</small></div></div></td>
      ${cols.map(k=>`<td>${C[k].f(C[k].g(r,b),r,b)}</td>`).join("")}</tr>`; }).join("")}</tbody></table>
    ${list.length?"":`<p class="muted" style="padding:14px">No markets match.</p>`}`;
}

    </div>
    <div id="curveChart"></div><div class="legend-row" id="curveLegend"></div>
    <p class="note">Maturities are spaced on a square-root scale so the short end is readable. Dots are the quoted bonds; lines in between are straight-line estimates.${one?" Past curves use the maturities that have a daily history.":""}</p></div></section>
  ${pairHTML()}
  <section>${secHead({eyebrow:"Shape",title:"Curve slopes",lead:"How much extra yield longer bonds pay. Click a column to sort."})}
    <div class="tablebox" id="slopeTable">${slopeTable()}</div>
    ${more("slopehelp",`<ul><li><b>3m10y, 2s10s, 5s30s, 10s30s:</b> the long yield minus the short one, in bp. Positive = normal, upward-sloping; negative = inverted.</li>
      <li><b>Butterfly (2s5s10s):</b> twice the 5-year minus the 2- and 10-year. Positive = the middle of the curve is high (a hump), negative = it sags.</li>

      <p class="note">Fit explains ${Math.round(fit.r2*100)}% of the spread (R²). ${S.sx==="rating"&&["realY","vsUS","y"].includes(S.sy)?"Above the line = pays more than its rating suggests (cheap, or the market sees risk the agencies don't); below = rich for its rating.":"The further from the line, the more unusual the market."}</p>
      <div class="legend-row"><span class="key dotk"><i style="background:var(--s1)"></i>Developed</span><span class="key dotk"><i style="background:var(--s2)"></i>Emerging</span></div>`;
  } else $("#resid").innerHTML=`<p class="note">Top right = good value from a safer government. Value = real yield, cushion against rising yields and cheapness vs its own past; safety = rating, debt, budget gap and interest bill.</p>
      <div class="legend-row"><span class="key dotk"><i style="background:var(--s1)"></i>Developed</span><span class="key dotk"><i style="background:var(--s2)"></i>Emerging</span></div>`;
}

/* ---------- central banks */
function bankRows(){
  const seen=new Map();
  rows().forEach(r=>{ if(!r.policy) return; const k=r.policy.bank; if(seen.has(k)) return;
    const ref = k==="XM"? byCode("DE") : r;  // the ECB's market read comes from German yields
    const two = ref.bonds.find(b=>b.tenor==="2Y"&&!b.outlier);
    seen.set(k,{bank:k,name:BANK[k]||r.name,area:k==="XM"?"Euro area":r.name,code:ref.code,p:r.policy,infl:r.fiscal.inflNext,ten:B(ref),two,expects:ref.expects}); });
  return [...seen.values()];
}

function align(seriesList){  // a shared date grid, carrying each series' last value forward over short gaps
  const ts=[...new Set(seriesList.flatMap(s=>s.map(p=>p[0])))].sort((a,b)=>a-b);
  return {t:ts, v:seriesList.map(s=>{ const m=new Map(s.map(p=>[p[0],p[1]])); let last=null, lastT=null;
    return ts.map(t=>{ if(m.has(t)){ last=m.get(t); lastT=t; return last; } return last!=null&&t-lastT<12*86400? last : null; }); })};
}
function drawBanks(){
  const list=bankRows().filter(x=>S.banks.includes(x.bank)).slice(0,5);
  if(!list.length){ $("#bankChart").innerHTML='<p class="muted">Pick a central bank above.</p>'; $("#bankLegend").innerHTML=""; return; }
  const A=align(list.map(x=>x.p.series));
  lineChart($("#bankChart"),{t:A.t,series:list.map((x,i)=>({v:A.v[i],color:`var(--s${i+1})`,name:x.bank==="XM"?"ECB":x.area,w:2})),h:260,fmt:v=>v.toFixed(2)+"%"});
  $("#bankLegend").innerHTML=list.map((x,i)=>`<span class="key"><i style="background:var(--s${i+1})"></i>${esc(x.name)} ${yld(x.p.rate)}</span>`).join("");
}

function guideHTML(d){
  const w=d.weights;
  return `<section>${secHead({eyebrow:"Guide",title:"How to use Bond Compass",lead:"What each number means, how the score works and where the data comes from."})}
  <div class="acc">
    ${fold("g-start","Start here <small>a five-minute routine</small>",`<ol style="margin:0;padding-left:20px;display:grid;gap:6px">
      <li><b>Overview:</b> check the backdrop rules: are yields rising or falling, are central banks hiking or cutting, is credit calm?</li>
      <li><b>Monitor:</b> sort by <i>Score</i>, then switch the columns to <i>Carry</i> and <i>Spreads &amp; real</i> to see why the leaders lead.</li>
      <li><b>Curves:</b> decide <i>where</i> on the curve to own. A steep curve pays you to go longer (roll-down); an inverted one pays you to stay short.</li>
      <li><b>Countries:</b> the relative-value chart shows who pays enough for their rating; the debt arithmetic shows whose finances are drifting.</li>
      <li><b>Click a country</b> for every maturity's numbers, the history and the public finances behind it.</li></ol>`,true)}
    ${fold("g-terms","Bond terms <small>yield, duration, DV01, carry…</small>",`<div class="glossary">
      <div><b>Yield to maturity (YTM):</b> the yearly return if you buy today and hold to the end, with coupons reinvested at the same rate. Yields and prices move in opposite directions.</div>
      <div><b>Basis point (bp):</b> 0.01 percentage points. A yield going from 4.00% to 4.25% is up 25bp.</div>
      <div><b>Coupon:</b> the fixed interest a bond pays each year, as a % of its face value (usually 100).</div>
      <div><b>Clean price:</b> the quoted price per 100 of face value, excluding interest built up since the last coupon (accrued interest).</div>
      <div><b>Modified duration:</b> the % price change for a 1-percentage-point move in yield. Duration 8 → a 1% rise in yield loses about 8%.</div>
      <div><b>Macaulay duration:</b> the average time (in years) until you get your money back, weighted by each payment's present value.</div>
      <div><b>Convexity:</b> how much duration changes as yields move. It makes price gains from falling yields bigger than losses from rising ones.</div>
      <div><b>DV01:</b> the money made or lost on 1,000,000 of face value for each 1bp move in yield. Traders size positions with it.</div>
      <div><b>Roll-down:</b> on an upward-sloping curve a bond's yield falls as it gets closer to maturity, which lifts its price even if the curve doesn't move.</div>
      <div><b>Carry:</b> what you earn for holding a bond instead of cash: its yield (plus roll-down) minus the cash rate.</div>
      <div><b>Cushion (breakeven):</b> how far yields could rise over a year before carry and roll-down are wiped out and cash would have done better.</div>
      <div><b>Hedged yield:</b> a foreign bond's yield after swapping the currency back to pounds (or dollars) with forward contracts. The hedge costs or earns the gap between the two countries' short-term rates, so a high-yield country's bond often hedges back to a much lower yield.</div>
      <div><b>Real yield:</b> yield minus expected inflation. The return that actually grows your spending power.</div>
      <div><b>Spread:</b> the extra yield one bond pays over another, e.g. Italy over Germany. A widening spread signals rising worry.</div>
      <div><b>OAS:</b> option-adjusted spread: a corporate bond's extra yield over government bonds, adjusted for features like early repayment.</div>
      <div><b>Z-score:</b> how unusual today's yield is compared with its past year, in standard deviations.</div>
      <div><b>Yield curve, 2s10s:</b> yields across maturities; the 10-year minus the 2-year. Inverted (negative) curves have often come before recessions.</div>
      <div><b>Investment grade:</b> rated BBB− (S&amp;P/Fitch) or Baa3 (Moody's) or better. Below that is "high yield" (or "junk").</div>
      <div><b>r − g:</b> interest rate minus nominal growth. When r is above g, debt grows faster than the economy unless the government runs a surplus before interest.</div>
      <div><b>MOVE index:</b> the bond market's "fear gauge": expected volatility of US Treasury yields over the next month.</div></div>`)}
    ${fold("g-score","How the score works <small>value 60%, safety 40%</small>",`<p>Each market's benchmark bond (10-year where available) is ranked against all the others on seven numbers. Each rank runs from 0 (worst) to 100 (best); the score is their weighted average, so it is always relative: a 70 means better than most of the others today, not good in absolute terms.</p>
      <table class="comp" style="width:100%;border-collapse:collapse;font-size:13.5px"><thead><tr><th class="l" style="position:static">Ingredient</th><th style="position:static">Weight</th><th class="l" style="position:static">What it measures</th></tr></thead><tbody>
      ${Object.entries(PARTS).map(([k,p])=>`<tr><td class="l" style="white-space:normal"><b>${esc(p.name)}</b> <small class="muted">${p.group}</small></td><td class="num">${Math.round((w[k]||0)*100)}%</td><td class="l" style="white-space:normal">${esc(p.tip)}</td></tr>`).join("")}</tbody></table>
      <p><b>Signals:</b> 80+ Strong overweight · 60–79 Overweight · 40–59 Neutral · 20–39 Underweight · under 20 Avoid. A missing ingredient (for example, no 3-year history) is left out and the others re-weighted.</p>
      <p><b>Tested on the past, in part.</b> The <a href="#track">Track record</a> rebuilds the 75% of the score that can be rebuilt from data known at the time (everything except ratings and the budget gap) every month since 2017, and follows the top and bottom 20% hedged into pounds. It also runs practice portfolios from October 2026 that can't be tuned after the event.</p>`)}
    ${fold("g-uk","For a UK investor <small>pounds, gilts and currency</small>",`<ul>
      <li><b>Currency is often the biggest risk</b> in a foreign bond. A 10% move in the currency can swamp several years of yield difference. That's why the tables show yields <i>hedged into pounds</i>: it's the fair way to compare a gilt with a Bund or a Treasury.</li>
      <li><b>Hedging isn't free or costly by default</b>: it earns or pays the gap between UK and foreign short-term rates. Hedging a low-rate currency (yen, Swiss franc) into pounds adds yield; hedging a high-rate one (Brazil, Turkey) takes most of it away.</li>
      <li><b>Gilts held directly</b> are free of UK capital gains tax, so low-coupon gilts bought below 100 can be tax-efficient for taxable accounts (the gain to 100 is tax-free; only the coupon is taxed). Check with HMRC guidance or an adviser for your own case.</li>
      <li><b>Foreign government bonds</b> are mostly bought through bond funds or ETFs; many offer share classes hedged to pounds ("GBP Hedged").</li></ul>`)}
    ${fold("g-data","Where the data comes from <small>and how fresh it is</small>",`<ul>

    ${fold("g-health",`Data health <small>${d.health?`${d.health.quotes} of ${d.health.symbols} quotes live${d.health.stale.length?` · ${new Set(d.health.stale.map(x=>x.code)).size} markets with stale quotes`:""}`:""}</small>`,healthHTML(d))}
    ${fold("g-limits","Limits <small>read before acting</small>",`<ul>
      <li>Analytics use simplified conventions: actual/actual day count, settlement today, each market's usual coupon frequency. Good for comparing; not for settling a trade.</li>
      <li>Benchmark bonds change when governments issue new ones; a jump in coupon or maturity in the tables usually means the benchmark rolled.</li>
      <li>Hedged yields use policy rates, not the actual forward-contract prices, which also include a "cross-currency basis" (usually small in major currencies, larger in emerging ones).</li>
      <li>Real yields use IMF inflation forecasts, not market-implied inflation (only the US breakevens are market-based here).</li>
      <li>Returns are rebuilt from yields, not taken from an index or fund.</li>
      <li>Nothing here is advice. Bonds can and do lose money, especially long-dated ones when yields rise.</li></ul>`)}

const BRIEF = {index:null, sel:null, text:{}};
function inlineMd(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>").replace(/`([^`]+)`/g,"<code>$1</code>"); }
function md(text){
  const out=[]; let list=null, para=[];
  const flush=()=>{ if(para.length){ out.push(`<p>${inlineMd(para.join(" "))}</p>`); para=[]; } if(list){ out.push(`<ul>${list.join("")}</ul>`); list=null; } };
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trimEnd();
    if(!line.trim()){ flush(); continue; }
    const h=line.match(/^(#{3,4})\s+(.*)$/); if(h){ flush(); out.push(`<h4>${inlineMd(h[2])}</h4>`); continue; }
    const li=line.match(/^\s*[-*]\s+(.*)$/);
    if(li){ if(para.length){ out.push(`<p>${inlineMd(para.join(" "))}</p>`); para=[]; } (list=list||[]).push(`<li>${inlineMd(li[1])}</li>`); continue; }
    if(list) flush();
    para.push(line.trim());
  }
  flush(); return out.join("");
}
function briefParse(text){
  const lines=text.replace(/<!--[\s\S]*?-->/g,"").split(/\r?\n/); let title="", pre=[], secs=[], cur=null;
  for(const l of lines){ const h1=l.match(/^#\s+(.*)$/), h2=l.match(/^##\s+(.*)$/);
    if(h1&&!title){ title=h1[1]; continue; } if(h2){ cur={title:h2[1],lines:[]}; secs.push(cur); continue; } (cur?cur.lines:pre).push(l); }
  return {title, pre:pre.join("\n"), secs:secs.map(s=>({title:s.title, body:s.lines.join("\n")}))};
}
function briefingHTML(){
  return `<section>${secHead({eyebrow:"Weekly briefing",title:"The week in bonds",lead:"Written every Saturday from that week's numbers: a plain-English round-up of yields, credit, central banks, scores and the practice portfolios.",
    right:`<select id="briefSel" aria-label="Choose a week"><option>Loading…</option></select>`})}<div class="brief" id="briefBody"><p class="muted">Loading the latest briefing…</p></div></section>`;
}

async function drawHistory(r){
  const el=$("#hChart"), sel=$("#hTenor"); let H;

  const tens=Object.keys(H.series).sort((a,b)=>tenorYears(a)-tenorYears(b));
  if(!tens.length){ el.innerHTML='<p class="muted">No daily history for this market.</p>'; return; }
  if(!sel.options.length){ sel.innerHTML=tens.map(t=>`<option value="${t}" ${t===(tens.includes(r.bench)?r.bench:tens.at(-1))?"selected":""}>${tenorWord(t)}</option>`).join(""); }
  const st={mode:"y",range:"3"};
  const draw=async()=>{
    const t=sel.value, now=Date.now()/1000, since=st.range==="0"?0:now-(+st.range)*365.25*86400;
    const cut=s=>s.filter(p=>p[0]>=since);
    let series=[], fmt=v=>v.toFixed(2)+"%", note="", base=null;
    const live=(tn,src=r)=>{ const s=H.series[tn], bb=src.bonds.find(x=>x.tenor===tn), day=Math.floor(now/86400)*86400;
      return bb&&s&&s.length&&s[s.length-1][0]<day? [...s,[day,bb.y]] : s; };
    if(H.series[t]) H.series[t]=live(t);
    if(st.mode==="y"){ const s=cut(H.series[t]); const A=align([s]); series=[{v:A.v[0],color:"var(--s1)",name:`${t} yield`,w:2}];
      var T=A.t; note=`${tenorWord(t)} yield. Daily for the last 2 years, weekly before.`; }
    else if(st.mode==="s"){ if(!H.series["2Y"]||!H.series["10Y"]){ el.innerHTML='<p class="muted">Needs both 2- and 10-year history.</p>'; $("#hNote").textContent=""; return; }
      const A=align([cut(H.series["10Y"]),cut(H.series["2Y"])]); var T=A.t; series=[{v:A.v[0].map((v,i)=>v!=null&&A.v[1][i]!=null?(v-A.v[1][i])*100:null),color:"var(--s1)",name:"2s10s",w:2}];
      fmt=v=>v.toFixed(0)+"bp"; base=0; note="10-year minus 2-year yield. Below zero = inverted."; }
    else { const ref=st.mode==="us"?"US":"DE"; if(ref===r.code){ el.innerHTML=`<p class="muted">This is the reference market itself.</p>`; $("#hNote").textContent=""; return; }
      let R2; try{ R2=await loadHist(ref); }catch(e){ el.innerHTML='<p class="muted">Reference history unavailable.</p>'; return; }
      const rs=R2.series[t]||R2.series["10Y"]; if(!rs){ el.innerHTML='<p class="muted">No matching reference maturity.</p>'; return; }
      const A=align([cut(H.series[t]),cut(rs)]); var T=A.t; series=[{v:A.v[0].map((v,i)=>v!=null&&A.v[1][i]!=null?(v-A.v[1][i])*100:null),color:"var(--s2)",name:`Spread vs ${ref==="US"?"Treasuries":"Bunds"}`,w:2}];
      fmt=v=>v.toFixed(0)+"bp"; base=0; note=`${tenorWord(t)} yield minus the ${ref==="US"?"US Treasury":"German Bund"} of the same maturity. Rising = this market paying more over the reference.`; }
    lineChart(el,{t:T,series,h:280,fmt,baseline:base,area:st.mode==="y"?1:0});
    $("#hNote").textContent=note;
  };
  sel.onchange=draw; bindSeg("hMode",v=>{ st.mode=v; document.querySelectorAll("#hMode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)); draw(); });
  bindSeg("hRange",v=>{ st.range=v; document.querySelectorAll("#hRange button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)); draw(); });
  draw();
}

  document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{ [S.sx,S.sy]=b.dataset.preset.split(","); store.set("sx",S.sx); store.set("sy",S.sy);
    document.querySelectorAll("[data-preset]").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#sxSel").value=S.sx; $("#sySel").value=S.sy; drawScatter(); });
  const ax=()=>{ S.sx=$("#sxSel").value; S.sy=$("#sySel").value; store.set("sx",S.sx); store.set("sy",S.sy); document.querySelectorAll("[data-preset]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.preset===`${S.sx},${S.sy}`)); drawScatter(); };
  $("#sxSel")&&($("#sxSel").onchange=ax); $("#sySel")&&($("#sySel").onchange=ax);
  bindSeg("sgrpSeg",v=>{ S.sgrp=v; store.set("sgrp",v); document.querySelectorAll("#sgrpSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v)); drawScatter(); });
  // credit
  $("#creditSel")&&($("#creditSel").onchange=e=>{ S.credit=e.target.value; store.set("credit",S.credit); drawCredit(); });
  $("#inflSel")&&($("#inflSel").onchange=e=>{ S.infl=e.target.value; store.set("infl",S.infl); drawCredit(); });
  // banks
  document.querySelectorAll("[data-bsort]").forEach(th=>th.onclick=()=>{ const k=th.dataset.bsort; S.bankSort={k,dir:S.bankSort.k===k?-S.bankSort.dir:(k==="name"?1:-1)}; redrawBanks(); });
  document.querySelectorAll("[data-bank]").forEach(b=>b.onclick=()=>{ const k=b.dataset.bank; S.banks=S.banks.includes(k)?S.banks.filter(x=>x!==k):[...S.banks,k].slice(-5); store.set("banks",S.banks);
    document.querySelectorAll("[data-bank]").forEach(x=>x.setAttribute("aria-pressed",S.banks.includes(x.dataset.bank))); drawBanks(); });
}
function bindSort(){ document.querySelectorAll("#monTable th[data-sort]").forEach(th=>th.onclick=()=>{ const k=th.dataset.sort;
  S.sort={k,dir:S.sort.k===k?-S.sort.dir:(k==="name"?1:-1)}; store.set("sort",S.sort); $("#monTable").innerHTML=monitorTable(); bindTips($("#monTable")); bindSort(); }); }
function redrawMonitor(){ const v=document.querySelector('#app [data-view="monitor"]'); v.innerHTML=monitorHTML(); restoreOpen(v); bindControls(); bindTips(v); }
function redrawCurves(){ const v=document.querySelector('#app [data-view="curves"]'); v.innerHTML=curvesHTML(); restoreOpen(v); bindControls(); bindPair(); bindTips(v); drawCurves(); drawPair(); }
function redrawBanks(){ const v=document.querySelector('#app [data-view="banks"]'); v.innerHTML=banksHTML(); bindControls(); drawBanks(); }

/* ---------------------------------------------------------------- go */
function drawOverview(){ const el=$("#ovScatter"); if(!el) return;
  scatterChart(el,{pts:rows().map(r=>({x:r.m.safety,y:r.m.value,label:r.code,key:r.code,color:r.dm?"var(--s1)":"var(--s2)",tip:`<b>${esc(r.name)}</b><br>Value ${Math.round(r.m.value)} · safety ${Math.round(r.m.safety)} · score ${Math.round(r.m.score)}`})),
    xlab:"Safety (0–100) →",ylab:"Value (0–100) →",xfmt:v=>v.toFixed(0),yfmt:v=>v.toFixed(0),fit:false,quad:vsQuad,h:330}); }
Views.init(["overview","monitor","curves","countries","credit","banks","gilts","portfolio","briefing","record","guide"],
  {overview:drawOverview,curves:()=>{drawCurves();drawPair();},countries:()=>{drawMap();drawScatter();},credit:drawCredit,banks:drawBanks,briefing:drawBriefing,record:drawRecord});
let resizeT; addEventListener("resize",()=>{ clearTimeout(resizeT); resizeT=setTimeout(()=>{ if(S.data) Views.apply(); },200); });
startLoop({url:"bonds",onData:data=>{ S.data=data; render(); if(S.sel&&$("#drawer")) openDetail(S.sel); }});
</script>
</body>
